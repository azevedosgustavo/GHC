name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: x86
      - run: python -m pip install pyinstaller==5.13.2 -r app/requirements.txt
      - name: Unit tests
        env:
          PYTHONPATH: app
        run: |
          python -m unittest discover app/tests
          python -m unittest discover installer/tests
      - name: Build
        run: python installer/build.py --app app
      - name: Smoke test (install, launch, uninstall)
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'ghc-package-check.txt'
          $setupExe = (Get-ChildItem installer\dist\GHC-Setup-v*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          if (!$setupExe) { throw "Setup not found" }
          $check = Start-Process $setupExe -Wait -PassThru -ArgumentList '--verify-package', "`"$report`""
          if ($check.ExitCode -ne 0 -or !(Test-Path $report) -or (Get-Content $report -Raw) -ne 'OK') { throw "Package verification failed" }
          $setup = Start-Process $setupExe -Wait -PassThru -ArgumentList '--silent','--dir','C:\GHC','--startmenu','--desktop','--autostart'
          if ($setup.ExitCode -ne 0) { throw "Installer failed with code $($setup.ExitCode)" }
          if (!(Test-Path C:\GHC\GHC.exe)) { throw "GHC.exe not installed" }
          if (!(Test-Path C:\GHC\uninstall.exe)) { throw "uninstall.exe missing" }
          Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run -Name GHC
          $p = Start-Process C:\GHC\GHC.exe -PassThru
          Start-Sleep 6
          if ($p.HasExited) { throw "GHC.exe exited early with code $($p.ExitCode)" }
          Stop-Process $p -Force
          Start-Process C:\GHC\uninstall.exe -Wait -ArgumentList '--uninstall','--silent'
          Start-Sleep 10
          if (Test-Path C:\GHC\GHC.exe) { throw "uninstall left files" }
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          $setupExe = (Get-ChildItem installer\dist\GHC-Setup-v*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          $payload = (Get-ChildItem installer\build -Filter payload.zip -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          if (!$setupExe -or !$payload) { throw "Build outputs not found" }
          Copy-Item $setupExe out\GHC-Setup.exe
          Copy-Item $payload out\GHC-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ghc
          path: out/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/GHC-Setup.exe out/GHC-portable.zip --title "GHC ${{ github.ref_name }}" --notes "Instalador autocontido (inclui Python/Tk; nao precisa instalar nada). Windows 7+ 32/64 bits."
